name: Build application

on:
  push:
    paths:
      - .github/workflows/build.yaml
      - assets/**
      - lib/**
      - linux/**
      - pubspec*
  pull_request:
    paths:
      - .github/workflows/build.yaml
      - assets/**
      - lib/**
      - linux/**
      - pubspec*
  workflow_dispatch:

jobs:
  build-app:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          # - runner: ubuntu-24.04-arm
          #   platform: linux
          #   arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Cache Build Runner
        uses: actions/cache@v6
        with:
          path: .dart_tool/build
          key: ${{ runner.os }}-build-runner-${{ hashFiles('pubspec.lock') }}-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-build-runner-${{ hashFiles('pubspec.lock') }}
            ${{ runner.os }}-build-runner

      - name: Build application release
        run: |
          dart pub get
          dart run build_runner build
          flutter build ${{ matrix.platform }} --release --target-platform ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Upload application bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: xray-${{ matrix.platform }}-${{ matrix.arch }}-release
          path: build/${{ matrix.platform }}/${{ matrix.arch }}/release/bundle/
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download application bundles
        uses: actions/download-artifact@v8
        with:
          pattern: xray-*-release
          path: bundles
          merge-multiple: false

      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -e bundles/xray ] || [ -e bundles/lib ] || [ -e bundles/data ]; then
            tar -czf xray-linux-x64.tar.gz -C bundles .
          else
            for artifact in bundles/*; do
              [ -d "$artifact" ] || continue

              name="${artifact##*/}"
              archive_name="${name%-release}"

              tar -czf "${archive_name}.tar.gz" -C "$artifact" .
            done
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: xray-*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true