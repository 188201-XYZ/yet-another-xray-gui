name: Build application

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-app:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            arch: x64
          # - runner: ubuntu-24.04-arm
          #   platform: linux
          #   arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Build application release
        run: |
          dart pub get
          dart run build_runner build
          flutter build ${{ matrix.platform }} --release --target-platform ${{ matrix.platform }}-${{ matrix.arch }}

      - name: Upload application bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: xray-${{ matrix.platform }}-${{ matrix.arch }}-release
          path: build/${{ matrix.platform }}/${{ matrix.arch }}/release/bundle/
          if-no-files-found: error

  publish-release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download application bundles
        uses: actions/download-artifact@v8
        with:
          pattern: xray-*-release
          path: bundles
          merge-multiple: false

      - name: Package release archives
        shell: bash
        run: |
          for artifact in bundles/xray-*-release; do
            [ -d "$artifact" ] || continue
            name="${artifact##*/}"
            name="${name%-release}"
            tar -czf "${name}.tar.gz" -C "$artifact" .
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: xray-*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true